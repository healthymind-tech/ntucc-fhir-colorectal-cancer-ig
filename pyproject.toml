[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntucc-fhir-colorectal-cancer-ig"
version = "0.1.0a1"
description = "Reference implementation and tests for the NTUCC FHIR colorectal cancer IG"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["reference"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
