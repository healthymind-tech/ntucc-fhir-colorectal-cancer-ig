name: Build (sushi, pytest, CQL)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run sushi
        working-directory: ig
        run: |
          npm ci --prefix tools
          node tools/node_modules/fsh-sushi/dist/app.js . 2>&1 | tee sushi-output.log
          if grep -qE '[1-9][0-9]* Errors|[1-9][0-9]* Warnings' sushi-output.log; then
            echo "sushi reported errors or warnings"; exit 1
          fi

      - name: Generated files must be up to date
        run: |
          python3 scripts/build_fixtures.py
          python3 scripts/build_terminology.py
          git diff --exit-code tests/fixtures ig/input/fsh/conceptmaps.fsh ig/input/fsh/measure-reports.fsh ig/input/includes/terminology-candidates-table.md

      - name: Run pytest
        run: |
          pip install -e ".[test]"
          python -m pytest -q

      - name: Translate and execute CQL
        run: scripts/run_cql.sh

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            .cql-work/java
          key: cql-java-${{ hashFiles('scripts/run_cql_java.sh') }}

      # Independent cross-check on the HL7/CQF Java reference engine: every case
      # must give the same result as on the JavaScript engine.
      - name: Cross-check CQL on the Java reference engine
        run: scripts/run_cql_java.sh
