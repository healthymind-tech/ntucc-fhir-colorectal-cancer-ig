name: Publish IG to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install SUSHI and Jekyll
        run: |
          npm ci --prefix ig/tools
          echo "$GITHUB_WORKSPACE/ig/tools/node_modules/.bin" >> "$GITHUB_PATH"
          gem install jekyll

      - name: Download IG Publisher
        run: curl -fsSL -o publisher.jar https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar

      - name: Build IG
        working-directory: ig
        run: java -Xmx4g -jar ../publisher.jar -ig .

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ig/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
